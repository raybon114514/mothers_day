<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>母親節快樂</title>
    <style>
        /* 基礎重置與背景設定 */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            overflow: hidden; /* 隱藏超出畫面的漂浮愛心 */
        }

        /* 卡片容器，設定透視點以呈現 3D 效果 */
        .card-container {
            width: 320px;
            height: 480px;
            perspective: 1200px;
            cursor: pointer;
            z-index: 10;
        }

        /* 卡片本體 */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border-radius: 20px;
        }

        /* 觸發翻轉的 class */
        .card.is-flipped {
            transform: rotateY(180deg);
        }

        /* 卡片正反面共用樣式 */
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden; /* 翻轉到背面時隱藏 */
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }

        /* 卡片正面 */
        .card-front {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: white;
        }

        .card-front h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .hint {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 20px;
            animation: blink 2s infinite;
        }

        /* 正面裝飾動畫 */
        .flower {
            font-size: 5rem;
            margin: 20px 0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* 卡片背面（內頁） */
        .card-back {
            background-color: #fffafa;
            color: #d6336c;
            transform: rotateY(180deg);
            border: 4px solid #fecfef;
        }

        .card-back h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #e64980;
        }

        .card-back p {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #555;
            text-align: left;
            width: 100%;
        }

        .signature {
            margin-top: 40px !important;
            font-weight: bold;
            font-size: 1.3rem !important;
            color: #e64980 !important;
            text-align: right !important;
        }

        /* 背景漂浮愛心特效 */
        .floating-heart {
            position: absolute;
            font-size: 20px;
            color: #ff758c;
            animation: floatUp linear infinite;
            opacity: 0.7;
            z-index: 1;
            pointer-events: none; /* 避免干擾卡片點擊 */
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 點擊整個容器觸發翻轉 -->
    <div class="card-container" onclick="flipCard()">
        <div class="card" id="myCard">
            
            <!-- 卡片封面 -->
            <div class="card-front">
                <h1>母親節快樂</h1>
                <div class="flower">🌸</div>
                <div class="hint">（點擊翻開卡片）</div>
            </div>

            <!-- 卡片內頁 -->
            <div class="card-back">
                <h2>親愛的芝蘋媽媽：</h2>
                <p>謝謝您一直以來的照顧與包容，為了我們無私地付出。</p>
                <p>在這個特別的日子裡，祝您永遠健康美麗，天天開心！</p>
                <p class="signature">- 睿謙</p>
            </div>

        </div>
    </div>

    <script>
        // 控制卡片翻轉的函式
        function flipCard() {
            document.getElementById('myCard').classList.toggle('is-flipped');
        }

        // 動態生成背景漂浮愛心的函式
        function createHearts() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            
            // 隨機設定愛心的起始位置與動畫長度
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's'; // 3秒 ~ 6秒
            heart.style.fontSize = Math.random() * 15 + 15 + 'px'; // 15px ~ 30px
            
            document.body.appendChild(heart);

            // 當動畫結束後移除 DOM 元素，避免佔用記憶體
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // 每 400 毫秒生成一顆新愛心
        setInterval(createHearts, 400);
    </script>
</body>
</html>
